name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e "tools[dev]"
      - name: Tool tests
        run: pytest -q tools/tests
      - name: Entries and tables follow the schema and the rules
        run: yomikata validate
      - name: index.json is up to date
        run: yomikata index --check

  image:
    needs: catalog
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: tools
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/yomikata-tools:latest
            ghcr.io/${{ github.repository_owner }}/yomikata-tools:sha-${{ github.sha }}
