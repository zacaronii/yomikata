name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e "tools[dev]"
      - name: Build the reader runtime
        run: |
          cmake -S runtime -B runtime/build
          cmake --build runtime/build -j
      - name: The runtime shows only its own functions
        run: |
          nm -D --defined-only runtime/build/libyomikata_reader.so | awk '{print $3}' | tee /dev/stderr | grep -v '^yk_' && exit 1 || true
      - name: Tool tests
        run: pytest -q tools/tests
        env:
          YOMIKATA_REQUIRE_READER: "1"
      - name: Entries and tables follow the schema and the rules
        run: yomikata validate
      - name: index.json is up to date
        run: yomikata index --check

  runtime-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the reader runtime for arm64-v8a
        run: |
          cmake -S runtime -B runtime/build-android \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 -DANDROID_STL=c++_static
          cmake --build runtime/build-android -j
          file runtime/build-android/libyomikata_reader.so | grep -q "ARM aarch64"

  image:
    needs: catalog
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/yomikata-tools
      HARNESS: ghcr.io/${{ github.repository_owner }}/yomikata-harness
    steps:
      - uses: actions/checkout@v4
      - name: Build the tools image
        run: docker build -t "$IMAGE:latest" -t "$IMAGE:sha-${{ github.sha }}" -f tools/Dockerfile .
      - name: The image has the tools and the reader runtime
        run: |
          docker run --rm "$IMAGE:latest" validate --help > /dev/null
          docker run --rm --entrypoint python "$IMAGE:latest" -c "from yomikata import reader; print('reader', reader.version())"
      - name: Build the harness image
        run: docker build -t "$HARNESS:latest" -t "$HARNESS:sha-${{ github.sha }}" -f tools/Dockerfile.harness --build-arg BASE="$IMAGE:latest" .
      - name: The harness answers, and has an OpenGL context without a screen
        run: |
          echo '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | docker run --rm -i --network none --tmpfs /scratch:uid=99,gid=100 "$HARNESS:latest" | grep -q '"script_try"'
          docker run --rm --network none --tmpfs /scratch:uid=99,gid=100 --entrypoint python "$HARNESS:latest" -c "from yomikata.replay import glcontext; c = glcontext.Context(); c.make_framebuffer(640, 480); print(c.version, '|', c.renderer)" | grep llvmpipe
          docker run --rm --network none --tmpfs /scratch:uid=99,gid=100 --entrypoint python "$HARNESS:latest" -c "import ctypes; ctypes.CDLL('libGL.so.1'); ctypes.CDLL('libgomp.so.1'); print('libGL.so.1 and libgomp.so.1 load')"
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        if: github.event_name == 'push'
        run: |
          docker push --all-tags "$IMAGE"
          docker push --all-tags "$HARNESS"
