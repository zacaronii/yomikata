name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e "tools[dev]"
      - name: Tool tests
        run: pytest -q tools/tests
      - name: Entries and tables follow the schema and the rules
        run: yomikata validate
      - name: index.json is up to date
        run: yomikata index --check
