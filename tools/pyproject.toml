[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yomikata-tools"
version = "0.1.0"
description = "Tools for the Yomikata catalog: identify releases, validate entries and tables, build the index"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = ["jsonschema>=4.21"]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8", "fastapi>=0.110", "httpx>=0.27"]

[project.scripts]
yomikata = "yomikata.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
