[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yomikata-tools"
version = "0.1.0"
description = "Tools for the Yomikata catalog: identify releases, validate entries and tables, build the index"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["jsonschema>=4.21"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
yomikata = "yomikata.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
